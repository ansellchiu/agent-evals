# Docs-only repository: the one check is a docs check.
# No secrets, no network writes; runs on GitHub-hosted runners.
commands:
  lint: |
    set -eu
    files=$(git ls-files '*.md')
    echo "== whitespace: no trailing spaces, no tabs, final newline"
    if grep -nE '[[:space:]]+$' $files; then echo "trailing whitespace"; exit 1; fi
    for f in $files; do
      [ -z "$(tail -c1 "$f")" ] || { echo "$f: missing final newline"; exit 1; }
    done
    echo "== fences: every file closes its code fences"
    for f in $files; do
      n=$(grep -cE '^[[:space:]]*(```|~~~)' "$f" || true)
      [ $((n % 2)) -eq 0 ] || { echo "$f: unbalanced code fence"; exit 1; }
    done
    echo "== links: markdown link check (read-only)"
    for f in $files; do npx --yes markdown-link-check@3.12.2 -q "$f"; done
